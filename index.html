<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Night Phrase Book 🍸</title>

  <!-- PWA / iPhone -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0d0010" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Night Phrases" />

  <!-- Supabase + React + Babel -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:       #0d0010;
      --deep:        #110018;
      --surface:     #1a0028;
      --card-bg:     #200030;
      --border:      #3d0060;
      --border-glow: #7c00c8;

      --purple:      #b44fff;
      --purple-dim:  #7c00c8;
      --purple-pale: #2a0040;
      --pink:        #ff4fa3;
      --pink-dim:    #c8005e;
      --pink-pale:   #3a0020;

      /* スペイン語アクセント */
      --es-accent:   #ff7043;
      --es-bg:       #1e0a00;
      --es-border:   #7a3010;
      --es-text:     #ff9a70;

      --text:        #f0e6ff;
      --text-dim:    #9980b8;
      --text-muted:  #5c4575;

      --radius: 10px;
      --shadow: 0 2px 16px rgba(180,79,255,.12);
      --shadow-lg: 0 8px 40px rgba(180,79,255,.22);
      --glow-purple: 0 0 18px rgba(180,79,255,.45);
      --glow-pink:   0 0 18px rgba(255,79,163,.45);
      --glow-es:     0 0 14px rgba(255,112,67,.4);
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--black); color: var(--text); min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--deep); }
    ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }

    /* ══ HEADER ══ */
    .header { background: linear-gradient(135deg,#110018 0%,#1d002e 100%); border-bottom: 1.5px solid var(--border-glow); box-shadow: 0 4px 32px rgba(180,79,255,.3); padding: 20px 24px 16px; padding-top: max(20px,env(safe-area-inset-top)); position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 960px; margin: 0 auto; }
    .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .header-icon { width: 46px; height: 46px; background: linear-gradient(135deg,var(--purple-dim),var(--pink-dim)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: var(--glow-purple); flex-shrink: 0; border: 1.5px solid var(--purple); }
    .header h1 { font-size: 1.35rem; font-weight: 800; background: linear-gradient(90deg,var(--purple),var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -.3px; }
    .header-sub { font-size: .76rem; color: var(--text-dim); margin-left: 58px; margin-top: 2px; }
    .voice-indicator { font-size: .67rem; color: var(--purple); opacity: .75; margin-left: 58px; margin-top: 1px; }
    .settings-btn { margin-left: auto; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 17px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
    .settings-btn:hover { background: rgba(180,79,255,.15); border-color: var(--purple); color: var(--purple); }
    .api-mode-badge { font-size: .63rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; letter-spacing: .4px; }
    .api-mode-badge.openai { background: #10a37f; color: #fff; }
    .api-mode-badge.fallback { background: rgba(180,79,255,.15); color: var(--purple); border: 1px solid var(--border); }

    .main { max-width: 960px; margin: 0 auto; padding: 20px 16px max(40px,calc(env(safe-area-inset-bottom) + 24px)); }

    /* ══ 翻訳パネル ══ */
    .translate-panel { background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; margin-bottom: 24px; border: 1.5px solid var(--border-glow); }
    .translate-panel-header { background: linear-gradient(135deg,#1d002e,#2a0040); padding: 12px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .translate-panel-header-icon { width: 28px; height: 28px; background: linear-gradient(135deg,var(--purple-dim),var(--pink-dim)); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .translate-panel-title { font-size: .9rem; font-weight: 700; color: var(--text); }
    .translate-panel-subtitle { font-size: .72rem; color: var(--purple); opacity: .85; margin-left: auto; }
    .translate-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
    @media (max-width: 620px) { .translate-body { grid-template-columns: 1fr; } .translate-divider { height: 36px; border-left: none; border-right: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); } }
    .translate-src { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .translate-lang-label { font-size: .7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; }
    .translate-textarea { flex: 1; border: none; outline: none; resize: none; font-size: .96rem; line-height: 1.6; color: var(--text); font-family: inherit; min-height: 90px; background: transparent; }
    .translate-textarea::placeholder { color: var(--text-muted); }
    .translate-src-footer { display: flex; align-items: center; justify-content: space-between; }
    .translate-clear { background: none; border: none; cursor: pointer; font-size: .75rem; color: var(--text-muted); padding: 4px 8px; border-radius: 6px; }
    .translate-clear:hover { color: var(--pink); background: var(--pink-pale); }
    .char-count { font-size: .7rem; color: var(--text-muted); }
    .translate-divider { display: flex; align-items: flex-start; justify-content: center; padding: 20px 4px 0; background: var(--deep); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .translate-arrow-icon { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,var(--purple-dim),var(--pink-dim)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; box-shadow: var(--glow-purple); }
    .translate-dst { display: flex; flex-direction: column; }
    .lang-block { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .lang-block-es { background: var(--es-bg); border-top: 1.5px dashed var(--es-border); }
    .lang-flag-label { font-size: .72rem; font-weight: 700; letter-spacing: .7px; display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
    .lang-flag-label.en { color: var(--purple); }
    .lang-flag-label.es { color: var(--es-accent); }
    .translate-result-text { font-size: 1.05rem; font-weight: 600; color: var(--text); line-height: 1.55; min-height: 50px; white-space: pre-wrap; }
    .translate-result-text.placeholder { font-weight: 400; color: var(--text-muted); font-size: .88rem; min-height: 40px; }
    .translate-result-text.loading { color: var(--text-muted); font-size: .88rem; font-style: italic; display: flex; align-items: center; gap: 8px; }
    .translate-result-text.error { color: var(--pink); font-size: .85rem; font-weight: 400; }
    .translate-result-text.es-text { color: var(--es-text); }
    .translate-ipa-row { display: flex; align-items: center; gap: 8px; min-height: 20px; }
    .translate-ipa-text { font-size: .82rem; font-family: 'Georgia','Times New Roman',serif; letter-spacing: .3px; }
    .translate-ipa-text.en { color: var(--purple); }
    .translate-ipa-text.es { color: var(--es-accent); opacity: .85; }
    .translate-ipa-loading { font-size: .75rem; color: var(--text-muted); font-style: italic; display: flex; align-items: center; gap: 6px; }
    .spinner-sm { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--purple); animation: spin .7s linear infinite; flex-shrink: 0; }
    .lang-speak-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .speak-big-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: none; border-radius: 8px; background: var(--purple-dim); color: #fff; cursor: pointer; font-size: .82rem; font-weight: 600; transition: all .15s; }
    .speak-big-btn:hover { background: var(--purple); box-shadow: var(--glow-purple); }
    .speak-big-btn:disabled { opacity: .4; cursor: default; }
    .speak-big-btn.speaking { background: var(--pink-dim); animation: pulse 1s infinite; box-shadow: var(--glow-pink); }
    .speak-big-btn.es-btn { background: var(--es-border); }
    .speak-big-btn.es-btn:hover { background: var(--es-accent); box-shadow: var(--glow-es); }
    .speak-big-btn.es-btn.speaking { background: var(--pink-dim); box-shadow: var(--glow-pink); }
    .translate-save-row { padding: 10px 16px 14px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .save-translate-btn { display: flex; align-items: center; gap: 5px; padding: 9px 18px; border: 1.5px solid var(--purple); border-radius: 8px; background: var(--purple-pale); cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--purple); transition: all .15s; }
    .save-translate-btn:hover { background: rgba(180,79,255,.2); box-shadow: var(--glow-purple); }
    .save-translate-btn:disabled { opacity: .4; cursor: default; }
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--purple); animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══ Toolbar ══ */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .search-wrap { flex: 1 1 220px; position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; pointer-events: none; }
    .search-input { width: 100%; padding: 10px 12px 10px 36px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: .92rem; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s; }
    .search-input:focus { border-color: var(--purple); box-shadow: 0 0 0 2px rgba(180,79,255,.15); }
    .search-input::placeholder { color: var(--text-muted); }
    .add-btn { padding: 9px 18px; background: linear-gradient(135deg,var(--purple-dim),var(--pink-dim)); border: none; border-radius: var(--radius); font-size: .88rem; font-weight: 700; cursor: pointer; color: #fff; white-space: nowrap; box-shadow: var(--glow-purple); transition: all .15s; }
    .add-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* ══ Filter row ══ */
    .filter-row { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: none; align-items: center; margin-bottom: 14px; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 20px; background: var(--surface); font-size: .82rem; cursor: pointer; transition: all .15s; white-space: nowrap; color: var(--text-dim); display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .filter-btn:hover { border-color: var(--purple); color: var(--purple); }
    .filter-btn.active { background: var(--purple-dim); border-color: var(--purple); color: #fff; box-shadow: var(--glow-purple); }
    .filter-btn .del-cat { font-size: .65rem; opacity: .6; margin-left: 2px; border: none; background: none; cursor: pointer; padding: 0 2px; color: inherit; }
    .filter-btn .del-cat:hover { opacity: 1; }
    .add-cat-btn { padding: 7px 12px; border: 1.5px dashed var(--border); border-radius: 20px; background: transparent; font-size: .82rem; cursor: pointer; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; transition: all .15s; }
    .add-cat-btn:hover { border-color: var(--purple); color: var(--purple); }
    .stats { font-size: .78rem; color: var(--text-muted); margin-bottom: 12px; }

    /* ══ Cards ══ */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(290px,1fr)); gap: 14px; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 16px 0; cursor: pointer; transition: transform .15s,box-shadow .15s; border: 1px solid var(--border); border-top: 3px solid transparent; position: relative; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border-glow); }
    .card-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .7rem; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .card-phrase { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 3px; padding-right: 62px; }
    .card-ipa { font-size: .75rem; color: var(--purple); font-family: 'Georgia','Times New Roman',serif; margin-bottom: 2px; }
    .card-reading { font-size: .78rem; color: var(--text-muted); margin-bottom: 6px; }

    /* スペイン語ブロック (カード) */
    .card-es-block { margin: 6px 0 4px; padding: 7px 10px; background: var(--es-bg); border-left: 3px solid var(--es-border); border-radius: 0 6px 6px 0; }
    .card-phrase-es { font-size: .92rem; font-weight: 700; color: var(--es-text); line-height: 1.35; }
    .card-ipa-es { font-size: .72rem; color: var(--es-accent); opacity: .85; font-family: 'Georgia','Times New Roman',serif; margin-top: 2px; }

    .card-meaning { font-size: .86rem; color: var(--text-dim); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag { font-size: .68rem; padding: 2px 7px; background: var(--surface); color: var(--text-muted); border-radius: 10px; border: 1px solid var(--border); }
    .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
    .card:hover .card-actions { opacity: 1; }
    .icon-btn { width: 36px; height: 36px; border: none; background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background .12s; color: var(--text-dim); border: 1px solid var(--border); }
    .icon-btn:hover { background: var(--purple-pale); color: var(--purple); }
    .icon-btn.delete:hover { background: var(--pink-pale); color: var(--pink); border-color: var(--pink-dim); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid var(--border); padding: 8px 0 10px; gap: 6px; }
    .card-speak-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .speak-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1.5px solid var(--border); border-radius: 20px; background: var(--surface); cursor: pointer; font-size: .74rem; color: var(--text-dim); transition: all .15s; }
    .speak-btn:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-pale); }
    .speak-btn.speaking { border-color: var(--pink); color: var(--pink); background: var(--pink-pale); animation: pulse 1s infinite; }
    .speak-btn.es { border-color: var(--es-border); color: var(--es-accent); }
    .speak-btn.es:hover { border-color: var(--es-accent); background: var(--es-bg); box-shadow: var(--glow-es); }
    .speak-btn.es.speaking { border-color: var(--pink); color: var(--pink); background: var(--pink-pale); animation: pulse 1s infinite; }
    .word-toggle-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border: 1.5px solid var(--border); border-radius: 20px; background: var(--surface); cursor: pointer; font-size: .74rem; color: var(--text-dim); transition: all .15s; flex-shrink: 0; }
    .word-toggle-btn:hover { border-color: var(--purple); color: var(--purple); }
    .word-toggle-btn.open { border-color: var(--purple); color: var(--purple); background: var(--purple-pale); }

    /* Word breakdown */
    .word-breakdown { padding: 10px 0 12px; border-top: 1px solid var(--border); }
    .word-breakdown-label { font-size: .68rem; font-weight: 700; letter-spacing: .6px; margin: 8px 0 4px; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .word-breakdown-label.en { color: var(--purple); background: var(--purple-pale); }
    .word-breakdown-label.es { color: var(--es-accent); background: var(--es-bg); border: 1px solid var(--es-border); }
    .word-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .word-chip { display: inline-flex; flex-direction: column; padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; transition: all .15s; }
    .word-chip:hover { border-color: var(--purple); background: var(--purple-pale); }
    .word-chip.speaking { border-color: var(--pink); background: var(--pink-pale); }
    .word-chip.es { border-color: var(--es-border); background: var(--es-bg); }
    .word-chip.es:hover { border-color: var(--es-accent); background: rgba(255,112,67,.1); }
    .word-chip.es.speaking { border-color: var(--pink); background: var(--pink-pale); }
    .wc-en { font-size: .82rem; font-weight: 600; color: var(--text); }
    .wc-en.es { color: var(--es-text); }
    .wc-read { font-size: .65rem; color: var(--text-muted); font-style: italic; }
    .wc-ja { font-size: .7rem; color: var(--text-dim); margin-top: 2px; }
    .wc-note { font-size: .62rem; color: var(--text-muted); }

    /* ══ Modals ══ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; backdrop-filter: blur(4px); }
    .modal { background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 540px; box-shadow: var(--shadow-lg); overflow: hidden; max-height: 92vh; display: flex; flex-direction: column; border: 1.5px solid var(--border-glow); }
    .modal-sm { max-width: 380px; }
    .modal-header { background: linear-gradient(135deg,#1d002e,#2a0040); color: var(--text); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 1rem; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; opacity: .8; line-height: 1; }
    .modal-close:hover { opacity: 1; color: var(--pink); }
    .modal-body { padding: 20px; overflow-y: auto; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-dim); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .15s; font-family: inherit; background: var(--surface); color: var(--text); }
    .form-control:focus { border-color: var(--purple); box-shadow: 0 0 0 2px rgba(180,79,255,.15); }
    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 70px; }
    .form-section-label { font-size: .72rem; font-weight: 700; letter-spacing: .7px; padding: 6px 10px; border-radius: 6px; margin: 16px 0 10px; display: block; }
    .form-section-label.en { background: var(--purple-pale); color: var(--purple); }
    .form-section-label.es { background: var(--es-bg); color: var(--es-accent); border: 1px solid var(--es-border); }
    .modal-footer { padding: 12px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
    .btn-cancel { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: .88rem; color: var(--text-dim); }
    .btn-cancel:hover { border-color: var(--purple); color: var(--purple); }
    .btn-save { padding: 8px 22px; background: linear-gradient(135deg,var(--purple-dim),var(--pink-dim)); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: .88rem; font-weight: 700; box-shadow: var(--glow-purple); }
    .btn-save:hover { filter: brightness(1.15); }

    .color-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s; }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--purple); transform: scale(1.15); box-shadow: var(--glow-purple); }

    /* Detail modal */
    .detail-phrase { font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .detail-ipa { font-size: .85rem; color: var(--purple); font-family: 'Georgia','Times New Roman',serif; margin-bottom: 4px; }
    .detail-reading { font-size: .85rem; color: var(--text-muted); margin-bottom: 12px; }
    .detail-speak-row { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-speak-btn { display: flex; align-items: center; gap: 6px; padding: 9px 18px; border: none; border-radius: 8px; background: var(--purple-dim); color: #fff; cursor: pointer; font-size: .88rem; font-weight: 600; transition: all .15s; }
    .detail-speak-btn:hover { background: var(--purple); box-shadow: var(--glow-purple); }
    .detail-speak-btn.speaking { background: var(--pink-dim); animation: pulse 1s infinite; }
    .detail-speak-btn.es-btn { background: var(--es-border); }

  /* ══ Web Speech API — 英語＋スペイン語 ══ */
  const PREFERRED_VOICES_EN = ["Google US English","Samantha","Alex","Microsoft Aria Online (Natural) - English (United States)","Google UK English Female"];
  const PREFERRED_VOICES_ES = ["Google español","Google español de Estados Unidos","Monica","Juan","Paulina","Diego"];

  function useSpeech() {
    const [speakingId,  setSpeakingId]  = useState(null);
    const [voiceName,   setVoiceName]   = useState("");
    const [voiceNameEs, setVoiceNameEs] = useState("");
    const voiceRef   = useRef(null);
    const voiceRefEs = useRef(null);

    const loadVoice = useCallback(() => {
      const voices = window.speechSynthesis?.getVoices() || [];
      if (!voices.length) return;
      let en = null;
      for (const n of PREFERRED_VOICES_EN) { en = voices.find(v => v.name === n); if (en) break; }
      if (!en) en = voices.find(v => v.lang?.startsWith("en-US")) || voices.find(v => v.lang?.startsWith("en")) || voices[0];
      voiceRef.current = en; setVoiceName(en?.name || "");
      let es = null;
      for (const n of PREFERRED_VOICES_ES) { es = voices.find(v => v.name === n); if (es) break; }
      if (!es) es = voices.find(v => v.lang?.startsWith("es-")) || voices.find(v => v.lang?.startsWith("es"));
      voiceRefEs.current = es; setVoiceNameEs(es?.name || "");
    }, []);

    useEffect(() => {
      if (!window.speechSynthesis) return;
      loadVoice();
      window.speechSynthesis.onvoiceschanged = loadVoice;
      return () => window.speechSynthesis.cancel();
    }, [loadVoice]);

    /* lang: "en-US" | "es-ES" */
    const speak = useCallback((text, id, lang = "en-US") => {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      if (speakingId === id) { setSpeakingId(null); return; }
      const utt  = new SpeechSynthesisUtterance(text);
      const isEs = lang.startsWith("es");
      utt.lang   = lang; utt.rate = isEs ? 0.85 : 0.82; utt.pitch = 1; utt.volume = 1;
      const voice = isEs ? voiceRefEs.current : voiceRef.current;
      if (voice) utt.voice = voice;
      utt.onend  = () => setSpeakingId(null);
      utt.onerror = () => setSpeakingId(null);
      setSpeakingId(id);
      window.speechSynthesis.speak(utt);
    }, [speakingId]);

    return { speakingId, speak, voiceName, voiceNameEs };
  }

  /* ══ 翻訳関数 ══ */
  async function translateText(text, from, to) {
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && Array.isArray(data[0])) {
          const translated = data[0].map(c => Array.isArray(c) ? c[0] : "").filter(Boolean).join("");
          if (translated && translated !== text) return translated;
        }
      }
    } catch {}
    const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}%7C${to}`;
    const res2 = await fetch(url2);
    const json = await res2.json();
    if (Number(json.responseStatus) === 200) {
      const t = json.responseData?.translatedText || "";
      if (t && t !== text && !/^QUERY|^MYMEMORY|^\[/i.test(t)) return t;
    }
    throw new Error(`Translation ${from}→${to} failed`);
  }

  /* ══ IPA 取得 (英語) ══ */
  async function fetchEnIpa(phrase) {
    try {
      const tokens = phrase.match(/[a-zA-Z]+/g) || [];
      if (!tokens.length) return "/" + phrase + "/";
      const unique = [...new Set(tokens.map(w => w.toLowerCase()))];
      const ipaMap = {};
      await Promise.all(unique.slice(0, 18).map(async (word) => {
        try {
          const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
          if (!r.ok) return;
          const d = await r.json();
          if (!Array.isArray(d) || !d[0]) return;
          const entry = d[0];
          let ipa = entry.phonetic;
          if (!ipa && entry.phonetics) { const f = entry.phonetics.find(p => p.text?.trim()); if (f) ipa = f.text; }
          if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
        } catch {}
      }));
      const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
      return parts.length ? "/" + parts.join(" ") + "/" : "/" + phrase + "/";
    } catch { return "/" + phrase + "/"; }
  }

  /* ══ IPA 取得 (スペイン語) ══ */
  async function fetchEsIpa(phrase) {
    try {
      const tokens = phrase.match(/[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+/gi) || [];
      if (!tokens.length) return "/" + phrase + "/";
      const unique = [...new Set(tokens.map(w => w.toLowerCase()))];
      const ipaMap = {};
      await Promise.all(unique.slice(0, 12).map(async (word) => {
        try {
          const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/es/${word}`);
          if (!r.ok) return;
          const d = await r.json();
          if (!Array.isArray(d) || !d[0]) return;
          const entry = d[0];
          let ipa = entry.phonetic;
          if (!ipa && entry.phonetics) { const f = entry.phonetics.find(p => p.text?.trim()); if (f) ipa = f.text; }
          if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
        } catch {}
      }));
      const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
      return parts.length ? "/" + parts.join(" ") + "/" : "/" + phrase + "/";
    } catch { return "/" + phrase + "/"; }
  }

  /* ══ 単語解説生成 ══ */
  async function fetchWordBreakdown(phrase, fromLang, tokenPattern) {
    if (!phrase) return [];
    const rawTokens = phrase.match(tokenPattern) || [];
    if (!rawTokens.length) return [];
    const seen = new Set(); const unique = [];
    for (const t of rawTokens) { const k = t.toLowerCase(); if (!seen.has(k)) { seen.add(k); unique.push(t); } }
    const fallback = unique.slice(0, 14).map(w => ({ w, r: "", m: "", note: "" }));
    try {
      const transMap = {};
      const batch = unique.slice(0, 14).join("\n");
      const result = await translateText(batch, fromLang, "ja");
      result.split("\n").forEach((line, i) => { if (unique[i] && line.trim()) transMap[unique[i].toLowerCase()] = line.trim(); });
      const built = new Set();
      const translated = rawTokens
        .filter(t => { const k = t.toLowerCase(); if (built.has(k)) return false; built.add(k); return !!transMap[k]; })
        .slice(0, 14).map(w => ({ w, r: "", m: transMap[w.toLowerCase()] || "", note: "" }));
      return translated.length > 0 ? translated : fallback;
    } catch { return fallback; }
  }

  /* ══ OpenAI — ナイトライフ スラング特化 (EN + ES) ══ */
  async function openAIEnrich(jaText) {
    const apiKey = (localStorage.getItem("openai_api_key") || "").trim();
    if (!apiKey) throw new Error("no_key");

    const prompt =
`You are a nightlife language expert — a bilingual (English & Spanish) specialist in bar/club slang, flirting phrases, party lingo, and Gen Z street talk used in international nightlife (bars, clubs, lounges, rooftop parties).

Given the Japanese phrase below, output a JSON object with EXACTLY these 7 keys:

{
  "en":       "Most natural authentic English used in real nightlife. Prefer slang, contractions, casual phrasing over formal.",
  "ipa":      "/IPA transcription of the English phrase/",
  "es":       "Most natural Spanish equivalent. Use real bar/club slang from Latin America or Spain as appropriate.",
  "ipa_es":   "/IPA transcription of the Spanish phrase/",
  "words":    [{"w":"EnglishWord","m":"日本語の意味","r":"","note":"スラング種別（例: Gen Zスラング・バー用語・慣用表現）"}],
  "words_es": [{"w":"SpanishWord","m":"日本語の意味","r":"","note":"スラング種別（例: 中南米スラング・バー用語・動詞活用）"}],
  "nuance":   "One sentence in Japanese: when and how to use this in a nightlife context (e.g. バーで注文する時・クラブで盛り上がる時)"
}

RULES:
1. "en" / "es" — authentic nightlife expressions. If flirting: real pickup lines. If drinks: real bartender lingo.
2. "ipa" and "ipa_es" — BOTH REQUIRED. Wrap in /slashes/.
3. "words" / "words_es" — 3–7 key vocabulary each. "note" in Japanese, explain slang level.
4. "r" field — always "".
5. "nuance" — practical nightlife usage tip in Japanese.

Japanese input: "${jaText}"`;

    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: prompt }],
        temperature: 0.4,
        max_tokens: 1600,
        response_format: { type: "json_object" },
      }),
    });

    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(`OpenAI: ${e.error?.message || `HTTP ${res.status}`}`);
    }
    const data    = await res.json();
    const content = data.choices?.[0]?.message?.content || "";
    const jsonStr = content.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
    const parsed  = JSON.parse(jsonStr);

    /* ipa_es フォールバック */
    if (!parsed.ipa_es && parsed.es) {
      parsed.ipa_es = "/" + parsed.es + "/";
      console.warn("[openAIEnrich] ipa_es missing → fallback");
    }
    return parsed;
  }

  /* ══ 翻訳パネル ══ */
  function TranslatePanel({ onSaveRequest, speakingId, speak }) {
    const [jaText,   setJaText]   = useState("");
    const [enText,   setEnText]   = useState("");
    const [enStatus, setEnStatus] = useState("idle");
    const [esText,   setEsText]   = useState("");
    const [esStatus, setEsStatus] = useState("idle");
    const [errMsg,   setErrMsg]   = useState("");
    const [saving,   setSaving]   = useState(false);
    const [saveStep, setSaveStep] = useState("");
    const timerRef = useRef(null);

    useEffect(() => {
      const q = jaText.trim();
      if (!q) { setEnText(""); setEnStatus("idle"); setEsText(""); setEsStatus("idle"); setErrMsg(""); return; }
      setEnStatus("loading"); setEsText(""); setEsStatus("idle");
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(async () => {
        try {
          const en = await translateText(q, "ja", "en");
          setEnText(en); setEnStatus("done");
          setEsStatus("loading");
          try {
            const es = await translateText(en, "en", "es");
            setEsText(es); setEsStatus("done");
          } catch { setEsStatus("error"); }
        } catch {
          setErrMsg("翻訳に失敗。ネット接続を確認してください。");
          setEnStatus("error");
        }
      }, 700);
      return () => clearTimeout(timerRef.current);
    }, [jaText]);

    const handleSave = async () => {
      if (!jaText.trim() || saving) return;
      setSaving(true);
      const apiKey = (localStorage.getItem("openai_api_key") || "").trim();
      try {
        /* ── 経路A: OpenAI ── */
        if (apiKey) {
          setSaveStep("🤖 GPT-4o-mini で EN+ES 生成中...");
          try {
            const r = await openAIEnrich(jaText.trim());
            const en       = (r.en       || "").trim() || enText || jaText.trim();
            const es       = (r.es       || "").trim();
            const ipa      = (r.ipa      || "").trim() || "/" + en + "/";
            const ipa_es   = (r.ipa_es   || "").trim() || (es ? "/" + es + "/" : "");
            const words    = (Array.isArray(r.words)    && r.words.length    > 0) ? r.words    : en.split(/\s+/).filter(Boolean).map(w => ({ w, m:"", r:"", note:"" }));
            const words_es = (Array.isArray(r.words_es) && r.words_es.length > 0) ? r.words_es : es.split(/\s+/).filter(Boolean).map(w => ({ w, m:"", r:"", note:"" }));
            const nuance   = r.nuance || "";
            setSaveStep("💾 保存中...");
            onSaveRequest({ ja:jaText.trim(), en, ipa, words, es, ipa_es, words_es, nuance });
            return;
          } catch (e) {
            const msg = e.message === "no_key" ? "APIキー未設定" : e.message;
            setSaveStep(`⚠ GPT エラー (${msg})。フォールバック保存...`);
            await new Promise(r => setTimeout(r, 900));
          }
        }
        /* ── 経路B: フォールバック ── */
        const en = enText || jaText.trim();
        const es = esText || "";
        setSaveStep("① EN IPA 取得中..."); let ipa = "/" + en + "/";
        try { ipa = await fetchEnIpa(en); } catch {}
        setSaveStep("② ES IPA 取得中..."); let ipa_es = es ? "/" + es + "/" : "";
        try { if (es) ipa_es = await fetchEsIpa(es); } catch {}
        setSaveStep("③ EN 単語解析中..."); let words = [];
        try { words = await fetchWordBreakdown(en, "en", /[a-zA-Z']+/g); } catch {}
        if (!words.length) words = en.split(/\s+/).filter(Boolean).map(w => ({ w, m:"", r:"", note:"" }));
        setSaveStep("④ ES 単語解析中..."); let words_es = [];
        try { if (es) words_es = await fetchWordBreakdown(es, "es", /[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+/gi); } catch {}
        if (!words_es.length && es) words_es = es.split(/\s+/).filter(Boolean).map(w => ({ w, m:"", r:"", note:"" }));
        setSaveStep("💾 保存中...");
        onSaveRequest({ ja:jaText.trim(), en, ipa, words, es, ipa_es, words_es, nuance:"" });
      } finally {
        setSaving(false); setSaveStep("");
        setJaText(""); setEnText(""); setEnStatus("idle"); setEsText(""); setEsStatus("idle");
      }
    };

    const speakIdEn = "translate-en";
    const speakIdEs = "translate-es";
    return (
      <div className="translate-panel">
        <div className="translate-panel-header">
          <div className="translate-panel-header-icon">🍸</div>
          <span className="translate-panel-title">ナイトライフ フレーズ 翻訳</span>
          <span className="translate-panel-subtitle">JA → EN + ES スラング変換</span>
        </div>
        <div className="translate-body">
          {/* 左: 日本語 */}
          <div className="translate-src">
            <span className="translate-lang-label">🇯🇵 日本語</span>
            <textarea className="translate-textarea"
              placeholder={"例: 今夜一番好きなカクテルは？\nもう一杯おごらせて、など"}
              value={jaText} onChange={e => setJaText(e.target.value)} rows={4} />
            <div className="translate-src-footer">
              <button className="translate-clear" onClick={() => { setJaText(""); setEnText(""); setEnStatus("idle"); setEsText(""); setEsStatus("idle"); setErrMsg(""); }}>✕ クリア</button>
              <span className="char-count">{jaText.length} / 300</span>
            </div>
          </div>

          {/* 中: 矢印 */}
          <div className="translate-divider">
            <div className="translate-arrow-icon">→</div>
          </div>

          {/* 右: EN + ES */}
          <div className="translate-dst">
            {/* 英語 */}
            <div className="lang-block">
              <span className="lang-flag-label en">🇺🇸 English (Nightlife)</span>
              {enStatus === "idle"    && <div className="translate-result-text placeholder">翻訳結果がここに表示されます</div>}
              {enStatus === "loading" && <div className="translate-result-text loading"><span className="spinner-sm"/> 翻訳中...</div>}
              {enStatus === "error"   && <div className="translate-result-text error">{errMsg}</div>}
              {enStatus === "done" && (
                <>
                  <div className="translate-result-text">{enText}</div>
                  <div className="lang-speak-row">
                    <button className={`speak-big-btn${speakingId === speakIdEn ? " speaking" : ""}`}
                      onClick={() => speak(enText, speakIdEn, "en-US")} disabled={!enText}>
                      <SpeakerIcon size={14} speaking={speakingId === speakIdEn}/>
                      {speakingId === speakIdEn ? "再生中..." : "🔊 英語を読む"}
                    </button>
                  </div>
                </>
              )}
            </div>

            {/* スペイン語 */}
            <div className="lang-block lang-block-es">
              <span className="lang-flag-label es">🇪🇸 Español (Nightlife)</span>
              {esStatus === "idle"    && enStatus !== "done" && <div className="translate-result-text placeholder" style={{ fontSize:".82rem" }}>英語翻訳後に表示</div>}
              {esStatus === "loading" && <div className="translate-result-text loading"><span className="spinner-sm" style={{ borderTopColor:"var(--es-accent)" }}/> ES 翻訳中...</div>}
              {esStatus === "error"   && <div className="translate-result-text" style={{ color:"var(--es-accent)", fontSize:".82rem" }}>スペイン語取得失敗（保存時に再試行）</div>}
              {esStatus === "done" && (
                <>
                  <div className="translate-result-text es-text">{esText}</div>
                  <div className="lang-speak-row">
                    <button className={`speak-big-btn es-btn${speakingId === speakIdEs ? " speaking" : ""}`}
                      onClick={() => speak(esText, speakIdEs, "es-ES")} disabled={!esText}>
                      <SpeakerIcon size={14} speaking={speakingId === speakIdEs}/>
                      {speakingId === speakIdEs ? "再生中..." : "🔊 スペイン語を読む"}
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>

        <div className="translate-save-row">
          <button className="save-translate-btn" onClick={handleSave} disabled={!jaText.trim() || saving}>
            {saving ? <><span className="spinner"/>{saveStep || "保存中..."}</> : "💾 フレーズ集に保存"}
          </button>
        </div>
      </div>
    );
  }

                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {phrase.tags?.length > 0 && (
              <div className="detail-section">
                <div className="detail-label">タグ</div>
                <div className="card-tags">{phrase.tags.map(t => <span key={t} className="tag">#{t}</span>)}</div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  /* ══ フレーズ追加/編集モーダル ══ */
  function PhraseModal({ phrase, cats, onClose, onSave }) {
    const [form, setForm] = useState({
      phrase:    phrase?.phrase    || "",
      ipa:       phrase?.ipa       || "",
      reading:   phrase?.reading   || "",
      meaning:   phrase?.meaning   || "",
      phrase_es: phrase?.phrase_es || "",
      ipa_es:    phrase?.ipa_es    || "",
      category:  phrase?.category  || (cats[0]?.key || "bar"),
      example:   phrase?.example   || "",
      nuance:    phrase?.nuance    || "",
      tags:      (phrase?.tags || []).join(", "),
    });
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

    const handleSave = () => {
      if (!form.phrase.trim()) return;
      const tags = form.tags.split(",").map(t => t.trim()).filter(Boolean);
      onSave({ ...phrase, ...form, tags, words: phrase?.words || [], words_es: phrase?.words_es || [] });
    };

    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <div className="modal-header">
            <h2>{phrase ? "✏️ フレーズ編集" : "➕ フレーズ追加"}</h2>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <span className="form-section-label en">🇺🇸 English</span>
            <div className="form-group">
              <label>英語フレーズ *</label>
              <input className="form-control" value={form.phrase} onChange={e => set("phrase", e.target.value)} placeholder="What's your poison?" />
            </div>
            <div className="form-group">
              <label>IPA 発音記号</label>
              <input className="form-control" value={form.ipa} onChange={e => set("ipa", e.target.value)} placeholder="/wʌts jɔːr ˈpɔɪzən/" />
            </div>
            <div className="form-group">
              <label>カタカナ読み</label>
              <input className="form-control" value={form.reading} onChange={e => set("reading", e.target.value)} placeholder="ワッツ ヨア ポイズン？" />
            </div>

            <span className="form-section-label es">🇪🇸 Español</span>
            <div className="form-group">
              <label>スペイン語フレーズ</label>
              <input className="form-control" value={form.phrase_es} onChange={e => set("phrase_es", e.target.value)} placeholder="¿Qué vas a tomar?" />
            </div>
            <div className="form-group">
              <label>ES IPA 発音記号</label>
              <input className="form-control" value={form.ipa_es} onChange={e => set("ipa_es", e.target.value)} placeholder="/ke ˈbas a toˈmar/" />
            </div>

            <span className="form-section-label en" style={{ marginTop:16 }}>📝 共通情報</span>
            <div className="form-group">
              <label>日本語の意味</label>
              <input className="form-control" value={form.meaning} onChange={e => set("meaning", e.target.value)} placeholder="何を飲みますか？" />
            </div>
            <div className="form-group">
              <label>使い方のコツ（ナイトライフ）</label>
              <textarea className="form-control" value={form.nuance} onChange={e => set("nuance", e.target.value)} placeholder="バーで隣の人に話しかける定番フレーズ" rows={2}/>
            </div>
            <div className="form-group">
              <label>カテゴリー</label>
              <select className="form-control" value={form.category} onChange={e => set("category", e.target.value)}>
                {cats.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>使用例</label>
              <textarea className="form-control" value={form.example} onChange={e => set("example", e.target.value)} placeholder="Don't worry — this round's on me." rows={2}/>
            </div>
            <div className="form-group">
              <label>タグ（カンマ区切り）</label>
              <input className="form-control" value={form.tags} onChange={e => set("tags", e.target.value)} placeholder="bar, ordering, classic" />
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn-cancel" onClick={onClose}>キャンセル</button>
            <button className="btn-save" onClick={handleSave} disabled={!form.phrase.trim()}>💾 保存</button>
          </div>
        </div>
      </div>
    );
  }

  /* ══ カテゴリー追加モーダル ══ */
  function CatModal({ onClose, onSave }) {
    const [label, setLabel] = useState("");
    const [pidx,  setPidx]  = useState(0);
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal modal-sm" onClick={e => e.stopPropagation()}>
          <div className="modal-header">
            <h2>🏷 カテゴリー追加</h2>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <div className="form-group">
              <label>ラベル（絵文字+テキスト）</label>
              <input className="form-control" value={label} onChange={e => setLabel(e.target.value)} placeholder="🎵 カラオケ" />
            </div>
            <div className="form-group">
              <label>アクセントカラー</label>
              <div className="color-swatch-row">
                {PALETTE.map((c, i) => (
                  <div key={i} className={`color-swatch${pidx === i ? " selected" : ""}`} style={{ background: c.border }} onClick={() => setPidx(i)} />
                ))}
              </div>
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn-cancel" onClick={onClose}>キャンセル</button>
            <button className="btn-save" onClick={() => { if (label.trim()) onSave({ key: Date.now().toString(36), label: label.trim(), paletteIdx: pidx, builtIn: false }); }} disabled={!label.trim()}>追加</button>
          </div>
        </div>
      </div>
    );
  }

  /* ══ 設定モーダル ══ */
  function SettingsModal({ onClose }) {
    const [key, setKey] = useState(() => localStorage.getItem("openai_api_key") || "");
    const save = () => { localStorage.setItem("openai_api_key", key.trim()); onClose(); };
    const hasKey = !!key.trim();
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal modal-sm" onClick={e => e.stopPropagation()}>
          <div className="modal-header">
            <h2>⚙️ 設定</h2>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <div className="form-group">
              <label>OpenAI API キー</label>
              <input className="form-control settings-key-input" type="password" value={key} onChange={e => setKey(e.target.value)} placeholder="sk-..." />
              <p className="settings-note">
                設定すると <strong>GPT-4o-mini</strong> で英語・スペイン語の本物ナイトライフスラングに変換し、単語解説も自動生成します。<br/>
                キーは端末のローカルストレージにのみ保存されます。
              </p>
            </div>
            <div style={{ marginTop:12, padding:"8px 12px", borderRadius:8, background: hasKey ? "rgba(16,163,127,.1)" : "var(--surface)", border:`1px solid ${hasKey ? "#10a37f" : "var(--border)"}`, fontSize:".8rem", color: hasKey ? "#10a37f" : "var(--text-muted)" }}>
              {hasKey ? "✅ APIキー設定済み — GPTモード有効 (EN + ES)" : "⚠ APIキー未設定 — 通常翻訳モードで動作"}
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn-cancel" onClick={onClose}>閉じる</button>
            <button className="btn-save" onClick={save}>保存</button>
          </div>
        </div>
      </div>
    );
  }

  /* ══ MAIN APP ══ */
  function App() {
    const [phrases,     setPhrases]     = useState(INITIAL_PHRASES);
    const [customCats,  setCustomCats]  = useState([]);
    const [search,      setSearch]      = useState("");
    const [filterCat,   setFilterCat]   = useState("all");
    const [dbLoaded,    setDbLoaded]    = useState(false);
    const [offline,     setOffline]     = useState(!navigator.onLine);
    const [showAdd,     setShowAdd]     = useState(false);
    const [editPhrase,  setEditPhrase]  = useState(null);
    const [detailPhrase,setDetailPhrase]= useState(null);
    const [showCatAdd,  setShowCatAdd]  = useState(false);
    const [showSettings,setShowSettings]= useState(false);

    const { speakingId, speak, voiceName, voiceNameEs } = useSpeech();
    const hasKey = !!(localStorage.getItem("openai_api_key") || "").trim();

    useEffect(() => {
      if (!db.ready || dbLoaded) return;
      db.loadAll().then(data => {
        if (!data) return;
        setDbLoaded(true);
        if (data.phrases.length > 0) setPhrases(data.phrases);
        if (data.customCats.length > 0) setCustomCats(data.customCats);
      }).catch(console.warn);
    }, []);

    useEffect(() => {
      const on  = () => setOffline(false);
      const off = () => setOffline(true);
      window.addEventListener("online",  on);
      window.addEventListener("offline", off);
      return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
    }, []);

    const allCats = useMemo(() => [...DEFAULT_CATEGORIES, ...customCats], [customCats]);

    const filtered = useMemo(() => {
      let list = phrases;
      if (filterCat !== "all") list = list.filter(p => p.category === filterCat);
      if (search.trim()) {
        const q = search.toLowerCase();
        list = list.filter(p =>
          p.phrase.toLowerCase().includes(q) ||
          p.phrase_es?.toLowerCase().includes(q) ||
          p.meaning?.toLowerCase().includes(q) ||
          p.reading?.toLowerCase().includes(q) ||
          p.tags?.some(t => t.toLowerCase().includes(q))
        );
      }
      return list;
    }, [phrases, filterCat, search]);

    const savePhrase = useCallback(async (p) => {
      const now = Date.now();
      const updated = p.id ? phrases.map(x => x.id === p.id ? p : x) : [...phrases, { ...p, id: now }];
      setPhrases(updated);
      await db.upsertPhrase({ ...p, id: p.id || now });
    }, [phrases]);

    const handleSaveRequest = useCallback(async ({ ja, en, ipa, words, es, ipa_es, words_es, nuance }) => {
      const newPhrase = {
        id: Date.now(),
        phrase: en, ipa: ipa || ("/" + en + "/"),
        reading: "", meaning: ja,
        phrase_es: es || "", ipa_es: ipa_es || "",
        nuance: nuance || "",
        category: "bar", example: "", tags: [], starred: false,
        words: words || [],
        words_es: words_es || [],
      };
      setPhrases(prev => [...prev, newPhrase]);
      await db.upsertPhrase(newPhrase);
    }, []);

    const deletePhrase = useCallback(async (id) => {
      if (!confirm("このフレーズを削除しますか？")) return;
      setPhrases(prev => prev.filter(p => p.id !== id));
      await db.deletePhrase(id);
    }, []);

    const addCat = useCallback(async (c) => {
      setCustomCats(prev => [...prev, c]);
      setShowCatAdd(false);
      await db.upsertCategory(c);
    }, []);

    const deleteCat = useCallback(async (key) => {
      setCustomCats(prev => prev.filter(c => c.key !== key));
      if (filterCat === key) setFilterCat("all");
      await db.deleteCategory(key);
    }, [filterCat]);

    return (
      <>
        {offline && <div className="offline-banner">📡 オフライン — データはローカルに保存されています</div>}

        <div className="header">
          <div className="header-inner">
            <div className="header-top">
              <div className="header-icon">🍸</div>
              <div>
                <h1>Night Phrase Book</h1>
              </div>
              <span className={`api-mode-badge ${hasKey ? "openai" : "fallback"}`} style={{ marginLeft:2 }}>
                {hasKey ? "GPT-4o-mini" : "通常モード"}
              </span>
              <button className="settings-btn" onClick={() => setShowSettings(true)} title="設定">⚙️</button>
            </div>
            <div className="header-sub">バー・クラブ・ナイトライフ専用 英語 + スペイン語フレーズ集</div>
            {(voiceName || voiceNameEs) && (
              <div className="voice-indicator">
                🔊 EN: {voiceName || "—"} &nbsp;|&nbsp; ES: {voiceNameEs || "—"}
              </div>
            )}
          </div>
        </div>

        <div className="main">
          <TranslatePanel onSaveRequest={handleSaveRequest} speakingId={speakingId} speak={speak} />
          <div className="neon-line" />

          <div className="toolbar">
            <div className="search-wrap">
              <span className="search-icon">🔍</span>
              <input className="search-input" placeholder="フレーズ・スペイン語・意味・タグで検索..." value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <button className="add-btn" onClick={() => { setEditPhrase(null); setShowAdd(true); }}>＋ 追加</button>
          </div>

          <div className="filter-row">
            <button className={`filter-btn${filterCat === "all" ? " active" : ""}`} onClick={() => setFilterCat("all")}>
              🌃 すべて ({phrases.length})
            </button>
            {allCats.map(c => (
              <button key={c.key} className={`filter-btn${filterCat === c.key ? " active" : ""}`} onClick={() => setFilterCat(c.key)}>
                {c.label}
                {!c.builtIn && (
                  <button className="del-cat" onClick={e => { e.stopPropagation(); deleteCat(c.key); }}>✕</button>
                )}
              </button>
            ))}
            <button className="add-cat-btn" onClick={() => setShowCatAdd(true)}>＋ カテゴリー</button>
          </div>

          <div className="stats">
            {filtered.length} フレーズ{search || filterCat !== "all" ? `（絞り込み中 / 全${phrases.length}件）` : ""}
            {db.ready ? " · Supabase 接続済み ✓" : " · ローカルモード"}
          </div>

          {filtered.length === 0 ? (
            <div className="empty">
              <div className="empty-icon">🍸</div>
              <p>フレーズが見つかりません。<br/>上の翻訳パネルから追加してみましょう！</p>
            </div>
          ) : (
            <div className="card-grid">
              {filtered.map(p => (
                <PhraseCard key={p.id} phrase={p} cats={allCats}
                  speakingId={speakingId} speak={speak}
                  onEdit={ph => { setEditPhrase(ph); setShowAdd(true); }}
                  onDelete={deletePhrase}
                  onDetail={setDetailPhrase}
                />
              ))}
            </div>
          )}
        </div>

        {showAdd && (
          <PhraseModal phrase={editPhrase} cats={allCats}
            onClose={() => { setShowAdd(false); setEditPhrase(null); }}
            onSave={async p => { await savePhrase(p); setShowAdd(false); setEditPhrase(null); }}
          />
        )}
        {detailPhrase && (
          <DetailModal phrase={detailPhrase} cats={allCats}
            speakingId={speakingId} speak={speak}
            onClose={() => setDetailPhrase(null)}
            onEdit={ph => { setDetailPhrase(null); setEditPhrase(ph); setShowAdd(true); }}
          />
        )}
        {showCatAdd && <CatModal onClose={() => setShowCatAdd(false)} onSave={addCat} />}
        {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
